<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The House of Nawabs — Fit, Price & Craft</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<style>
:root{--bg:#f7f3ec;--card:#fffdf9;--ink:#2a2420;--mute:#7a6f65;--line:#e4dccf;--accent:#8c2f39;--gold:#a8832f;--body:#d9cfc0;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171412;--card:#211d1a;--ink:#efe8dc;--mute:#a09585;--line:#383129;--accent:#d27a84;--gold:#d4b05a;--body:#4a4137}}
:root[data-theme="dark"]{--bg:#171412;--card:#211d1a;--ink:#efe8dc;--mute:#a09585;--line:#383129;--accent:#d27a84;--gold:#d4b05a;--body:#4a4137}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 100px)}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-weight:300}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
input[type=range]{accent-color:var(--accent);width:100%}
body{overflow-x:clip;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
@media (max-width:640px){input[type=range]{height:34px}input:not([type=range]):not([type=checkbox]),select{font-size:16px!important}button,select{min-height:40px}}
.snap-strip{scrollbar-width:none}.snap-strip::-webkit-scrollbar{display:none}
.card{background:var(--card);border:1px solid var(--line)}
.track{transition:transform .8s cubic-bezier(.65,0,.35,1)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useMemo, useEffect } = React;
const html = htm.bind(React.createElement);
const RATE={EUR:1,GBP:0.85,CHF:0.95};
const eur = n => { const cu=store.s.cur; return new Intl.NumberFormat('en-IE',{style:'currency',currency:cu}).format(n*RATE[cu]); };

/* ---------- SIZE DATA ---------- */
const SIZES = [
  {k:'S', uk:'8–10', eu:'36–38', us:'4–6', g:[98,80,104]},
  {k:'M', uk:'12', eu:'40', us:'8', g:[104,86,110]},
  {k:'L', uk:'14', eu:'42', us:'10', g:[110,92,116]},
  {k:'XL', uk:'16–18', eu:'44–46', us:'12–14', g:[118,100,124]},
];
const LIMITS = [[92,98,104],[74,80,86],[98,104,110]]; // chest, waist, hip upper bounds for S, M, L
const idxOf = (v, lim) => lim.findIndex(l => v < l) === -1 ? 3 : lim.findIndex(l => v < l);

function Slider({label, cm, set, min, max, inch}) {
  const shown = inch ? (cm/2.54).toFixed(1) + ' in' : cm + ' cm';
  return html`<div class="mb-5">
    <div class="flex justify-between text-xs tracking-widest uppercase mb-2" style=${{color:'var(--mute)'}}>
      <span>${label}</span><span class="serif text-lg normal-case tracking-normal" style=${{color:'var(--ink)'}}>${shown}</span></div>
    <input type="range" min=${min} max=${max} value=${cm} onChange=${e=>set(+e.target.value)} onInput=${e=>set(+e.target.value)} aria-label=${label}/>
  </div>`;
}

function Silhouette({m, size}) {
  const [c,w,h] = m, g = size.g;
  const f = v => v/4*1.55;
  const body = `M${100-40},74 L${100-f(c)},112 L${100-f(w)},165 L${100-f(h)},220 L${100-f(h)+4},325 L97,325 L97,250 L103,250 L103,325 L${100+f(h)-4},325 L${100+f(h)},220 L${100+f(w)},165 L${100+f(c)},112 L${100+40},74 Z`;
  const kurti = `M${100-38},72 L${100-f(g[0])},112 L${100-f(g[1])},165 L${100-f(h>g[2]?h:g[2])},222 L${100-f(g[2])-9},292 L${100+f(g[2])+9},292 L${100+f(g[2])},222 L${100+f(g[1])},165 L${100+f(g[0])},112 L${100+38},72 Q100,86 ${100-38},72 Z`;
  return html`<svg viewBox="0 0 200 340" class="w-full max-w-[260px] mx-auto" role="img" aria-label="Fit silhouette">
    <circle cx="100" cy="42" r="15" fill="var(--body)"/><rect x="95" y="55" width="10" height="18" fill="var(--body)"/>
    <path d=${body} fill="var(--body)" stroke="var(--mute)" stroke-width="0.8" style=${{transition:'all .35s'}}/>
    <path d=${kurti} fill="var(--accent)" fill-opacity="0.28" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="4 2" style=${{transition:'all .35s'}}/>
    <line x1="30" y1="112" x2="170" y2="112" stroke="var(--gold)" stroke-width=".5" stroke-dasharray="2 3"/>
    <line x1="30" y1="165" x2="170" y2="165" stroke="var(--gold)" stroke-width=".5" stroke-dasharray="2 3"/>
    <line x1="30" y1="222" x2="170" y2="222" stroke="var(--gold)" stroke-width=".5" stroke-dasharray="2 3"/>
    <text x="8" y="110" font-size="8" fill="var(--mute)">Chest</text><text x="8" y="163" font-size="8" fill="var(--mute)">Waist</text><text x="8" y="220" font-size="8" fill="var(--mute)">Hip</text>
  </svg>`;
}

/* ---------- MODULE 1 ---------- */
function FitMatrix() {
  const [sys, setSys] = useState('EU');
  const [inch, setInch] = useState(false);
  const [m, setM] = useState([92, 76, 100]);
  const [tryOn, setTryOn] = useState(0); // 0 idle, 1-3 steps, 4 done
  const set = i => v => setM(p => p.map((x,j) => j===i ? v : x));
  const idx = Math.max(...m.map((v,i) => idxOf(v, LIMITS[i])));
  const size = SIZES[idx];
  useEffect(() => setStore({size:size.k}), [size.k]);
  const driver = ['Chest','Waist','Hip'][m.map((v,i)=>idxOf(v,LIMITS[i])).indexOf(idx)];
  const ease = size.g.map((g,i) => g - m[i]);
  const fit = ease[0] < 5 ? 'Close, tailored fit' : ease[0] < 11 ? 'Classic relaxed fit' : 'Generous, flowing fit';
  useEffect(() => {
    if (tryOn > 0 && tryOn < 4) { const t = setTimeout(() => setTryOn(tryOn + 1), 1100); return () => clearTimeout(t); }
  }, [tryOn]);
  const steps = ['Reading your proportions','Draping Chikankari fabric','Rendering preview'];
  const Seg = ({opts, val, on}) => html`<div class="inline-flex border" style=${{borderColor:'var(--line)'}}>${opts.map(o => html`
    <button key=${o} onClick=${()=>on(o)} class="px-4 py-1.5 text-xs tracking-widest uppercase transition"
      style=${val===o?{background:'var(--ink)',color:'var(--bg)'}:{color:'var(--mute)'}}>${o}</button>`)}</div>`;
  return html`<section id="fit" class="py-16 md:py-24">
    <p class="text-xs tracking-[.3em] uppercase" style=${{color:'var(--gold)'}}>I · Fit</p>
    <h2 class="serif text-4xl md:text-5xl mt-2 mb-10">Size &amp; Fit Matrix</h2>
    <div class="grid lg:grid-cols-2 gap-8">
      <div class="card p-6 md:p-8">
        <div class="flex flex-wrap gap-4 justify-between mb-8">
          <${Seg} opts=${['UK','EU','US']} val=${sys} on=${setSys}/>
          <${Seg} opts=${['cm','inches']} val=${inch?'inches':'cm'} on=${v=>setInch(v==='inches')}/>
        </div>
        <${Slider} label="Chest" cm=${m[0]} set=${set(0)} min=${76} max=${126} inch=${inch}/>
        <${Slider} label="Waist" cm=${m[1]} set=${set(1)} min=${60} max=${112} inch=${inch}/>
        <${Slider} label="Hip" cm=${m[2]} set=${set(2)} min=${84} max=${134} inch=${inch}/>
        <div class="mt-8 pt-6 border-t flex items-center justify-between gap-4" style=${{borderColor:'var(--line)'}}>
          <div><p class="text-xs tracking-widest uppercase" style=${{color:'var(--mute)'}}>Your Nawabs size</p>
            <p class="serif text-6xl leading-none mt-1" style=${{color:'var(--accent)'}}>${size.k}</p></div>
          <div class="text-right text-sm"><p class="serif text-2xl">${sys} ${size[sys.toLowerCase()]}</p>
            <p style=${{color:'var(--mute)'}}>Driven by your ${driver.toLowerCase()}</p></div>
        </div>
        <div class="grid grid-cols-4 gap-2 mt-6 text-center text-xs">
          ${SIZES.map(s => html`<div key=${s.k} class="py-2 border" style=${s.k===size.k?{borderColor:'var(--accent)',color:'var(--accent)'}:{borderColor:'var(--line)',color:'var(--mute)'}}>
            <div class="serif text-lg">${s.k}</div>${s[sys.toLowerCase()]}</div>`)}
        </div>
      </div>
      <div class="card p-6 md:p-8 flex flex-col">
        <div class="flex gap-6 flex-col sm:flex-row items-center flex-1">
          <${Silhouette} m=${m} size=${size}/>
          <div class="text-sm w-full">
            <p class="serif text-2xl mb-1">${fit}</p>
            <p class="mb-4" style=${{color:'var(--mute)'}}>Knee-length kurti, size ${size.k}. Dashed line is the garment over your body.</p>
            <table class="w-full text-sm"><tbody>
              ${['Chest','Waist','Hip'].map((n,i) => html`<tr key=${n} class="border-t" style=${{borderColor:'var(--line)'}}>
                <td class="py-2" style=${{color:'var(--mute)'}}>${n} ease</td>
                <td class="py-2 text-right">+${inch?(ease[i]/2.54).toFixed(1)+' in':ease[i]+' cm'}</td></tr>`)}
            </tbody></table>
          </div>
        </div>
        <button onClick=${()=>setTryOn(tryOn===0||tryOn===4?1:tryOn)} class="mt-6 w-full py-3 text-xs tracking-[.25em] uppercase transition hover:opacity-90"
          style=${{background:'var(--accent)',color:'#fff'}}>✦ AI Try-On</button>
        ${tryOn>0 && html`<div class="mt-4 border p-4 text-sm" style=${{borderColor:'var(--line)'}}>
          ${tryOn<4 ? html`<p>${steps[tryOn-1]}…</p><div class="h-px mt-3 relative" style=${{background:'var(--line)'}}>
            <div class="h-px absolute left-0 top-0 transition-all duration-1000" style=${{width:(tryOn*33)+'%',background:'var(--accent)'}}></div></div>`
          : html`<p class="serif text-xl">Preview ready</p>
            <p style=${{color:'var(--mute)'}}>Upload a full-length photo to see size ${size.k} on you. (Demo: upload connects to your try-on service.)</p>
            <label class="inline-block mt-3 px-4 py-2 border cursor-pointer text-xs tracking-widest uppercase" style=${{borderColor:'var(--ink)'}}>
              Choose photo<input type="file" accept="image/*" class="hidden"/></label>`}
        </div>`}
      </div>
    </div>
  </section>`;
}

/* ---------- MODULE 2 ---------- */
const COUNTRIES = {
  Germany:{vat:19,duty:12,re:/^\d{5}$/,ph:'10115'}, France:{vat:20,duty:12,re:/^\d{5}$/,ph:'75001'},
  Italy:{vat:22,duty:12,re:/^\d{5}$/,ph:'00184'}, Spain:{vat:21,duty:12,re:/^\d{5}$/,ph:'28001'},
  Netherlands:{vat:21,duty:12,re:/^\d{4}\s?[A-Za-z]{2}$/,ph:'1012 AB'}, Sweden:{vat:25,duty:12,re:/^\d{3}\s?\d{2}$/,ph:'111 22'},
  Ireland:{vat:23,duty:12,re:/^[A-Za-z]\d{2}\s?[A-Za-z0-9]{4}$/,ph:'D02 X285'},
  'United Kingdom':{vat:20,duty:12,re:/^[A-Za-z]{1,2}\d[A-Za-z\d]?\s?\d[A-Za-z]{2}$/,ph:'SW1A 1AA'},
  Switzerland:{vat:8.1,duty:3,re:/^\d{4}$/,ph:'8001'},
};
const PRODUCTS = [
  {n:'Chikankari Angarkha Kurti', p:185}, {n:'Block-Printed Kalidar Kurti', p:142}, {n:'Zardozi Festive Kurti', p:268},
];
const SHIP = {express:{n:'Express',d:'3–5 working days',fee:38}, economy:{n:'Economy',d:'8–12 working days',fee:16}};

function Pricing() {
  const [country, setCountry] = useState(store.s.country);
  const [zip, setZip] = useState('');
  const [pi, setPi] = useState(0);
  const [qty, setQty] = useState(1);
  const [ship, setShip] = useState('economy');
  const c = COUNTRIES[country];
  useStore();
  useEffect(() => setStore({country, ship}), [country, ship]);
  useEffect(() => { if (store.s.country !== country) setCountry(store.s.country); }, [store.s.country]);
  const zipOk = c.re.test(zip.trim());
  const calc = useMemo(() => {
    const goods = PRODUCTS[pi].p * qty, sh = SHIP[ship].fee;
    const duty = (goods + sh) * c.duty / 100;
    const vat = (goods + sh + duty) * c.vat / 100;
    return {goods, sh, duty, vat, total: goods + sh + duty + vat};
  }, [pi, qty, ship, country]);
  const field = 'w-full px-3 py-2.5 border bg-transparent text-sm outline-none focus:border-[var(--accent)]';
  const lab = 'block text-xs tracking-widest uppercase mb-2';
  const rows = [
    ['Garment subtotal', eur(calc.goods), `${qty} × ${eur(PRODUCTS[pi].p)}`],
    [`${SHIP[ship].n} shipping`, eur(calc.sh), SHIP[ship].d],
    ['Import duty', eur(calc.duty), `${c.duty}% on goods + freight`],
    [`VAT · ${country}`, eur(calc.vat), `${c.vat}% on goods + freight + duty`],
  ];
  return html`<section id="price" class="py-16 md:py-24 border-t" style=${{borderColor:'var(--line)'}}>
    <p class="text-xs tracking-[.3em] uppercase" style=${{color:'var(--gold)'}}>II · Price</p>
    <h2 class="serif text-4xl md:text-5xl mt-2 mb-3">Delivered Duty Paid</h2>
    <p class="mb-10 max-w-xl" style=${{color:'var(--mute)'}}>No surprise fees at your door. Duty and VAT are collected at checkout, so the price below is the price you pay.</p>
    <div class="grid lg:grid-cols-5 gap-8">
      <div class="card p-6 md:p-8 lg:col-span-2 space-y-5">
        <div><label class=${lab} style=${{color:'var(--mute)'}}>Garment</label>
          <select class=${field} style=${{borderColor:'var(--line)',background:'var(--card)'}} value=${pi} onChange=${e=>setPi(+e.target.value)}>
            ${PRODUCTS.map((p,i)=>html`<option key=${i} value=${i}>${p.n} — ${eur(p.p)}</option>`)}</select></div>
        <div class="flex items-center justify-between"><span class=${lab} style=${{color:'var(--mute)',margin:0}}>Quantity</span>
          <div class="flex items-center border" style=${{borderColor:'var(--line)'}}>
            <button class="px-3 py-1" onClick=${()=>setQty(q=>Math.max(1,q-1))} aria-label="Decrease">−</button>
            <span class="px-4 serif text-lg">${qty}</span>
            <button class="px-3 py-1" onClick=${()=>setQty(q=>Math.min(10,q+1))} aria-label="Increase">+</button></div></div>
        <div><label class=${lab} style=${{color:'var(--mute)'}}>Destination</label>
          <select class=${field} style=${{borderColor:'var(--line)',background:'var(--card)'}} value=${country} onChange=${e=>{setCountry(e.target.value);setZip('');}}>
            ${Object.keys(COUNTRIES).map(k=>html`<option key=${k}>${k}</option>`)}</select></div>
        <div><label class=${lab} style=${{color:'var(--mute)'}}>Postal code</label>
          <input class=${field} style=${{borderColor:zip&&!zipOk?'var(--accent)':'var(--line)'}} value=${zip} placeholder=${'e.g. '+c.ph} onChange=${e=>setZip(e.target.value)} onInput=${e=>setZip(e.target.value)}/>
          <p class="text-xs mt-1.5 h-4" style=${{color:zipOk?'var(--gold)':'var(--accent)'}}>${zip?(zipOk?'✓ Delivery available':'Check the format for '+country):''}</p></div>
        <div><span class=${lab} style=${{color:'var(--mute)'}}>Delivery route</span>
          <div class="grid grid-cols-2 gap-3">
            ${Object.entries(SHIP).map(([k,s])=>html`<button key=${k} onClick=${()=>setShip(k)} class="text-left p-3 border transition"
              style=${ship===k?{borderColor:'var(--accent)',background:'color-mix(in srgb,var(--accent) 8%,transparent)'}:{borderColor:'var(--line)'}}>
              <div class="serif text-lg">${s.n}</div><div class="text-xs" style=${{color:'var(--mute)'}}>${s.d}</div>
              <div class="text-sm mt-1">${eur(s.fee)}</div></button>`)}</div></div>
      </div>
      <div class="card p-6 md:p-8 lg:col-span-3">
        <h3 class="serif text-2xl mb-1">${PRODUCTS[pi].n}</h3>
        <p class="text-sm mb-6" style=${{color:'var(--mute)'}}>Landed cost to ${zipOk?zip.trim().toUpperCase()+', ':''}${country}</p>
        <div class="overflow-x-auto"><table class="w-full text-sm min-w-[360px]">
          <thead><tr class="text-xs tracking-widest uppercase text-left" style=${{color:'var(--mute)'}}>
            <th class="pb-3 font-normal">Item</th><th class="pb-3 font-normal">Basis</th><th class="pb-3 font-normal text-right">Amount</th></tr></thead>
          <tbody>${rows.map(r=>html`<tr key=${r[0]} class="border-t" style=${{borderColor:'var(--line)'}}>
            <td class="py-3.5">${r[0]}</td><td class="py-3.5" style=${{color:'var(--mute)'}}>${r[2]}</td><td class="py-3.5 text-right">${r[1]}</td></tr>`)}</tbody>
          <tfoot><tr class="border-t-2" style=${{borderColor:'var(--ink)'}}>
            <td class="pt-5 serif text-2xl" colspan="2">Total landed price</td>
            <td class="pt-5 serif text-3xl text-right" style=${{color:'var(--accent)'}}>${eur(calc.total)}</td></tr></tfoot>
        </table></div>
        <div class="mt-8 grid grid-cols-3 text-center text-xs border-t pt-6" style=${{borderColor:'var(--line)',color:'var(--mute)'}}>
          <div><div class="serif text-2xl" style=${{color:'var(--ink)'}}>${Math.round((calc.duty/calc.total)*100)}%</div>duty</div>
          <div><div class="serif text-2xl" style=${{color:'var(--ink)'}}>${Math.round((calc.vat/calc.total)*100)}%</div>VAT</div>
          <div><div class="serif text-2xl" style=${{color:'var(--ink)'}}>€0</div>fees at delivery</div></div>
        <p class="text-xs mt-6" style=${{color:'var(--mute)'}}>Illustrative rates for demonstration; final duty and VAT are confirmed at checkout.</p>
      </div>
    </div>
  </section>`;
}

/* ---------- MODULE 3 ---------- */
const STORY = [
  {t:'Carving the Block', place:'Chowk, Lucknow', tx:'A master carver shapes seasoned sheesham wood into a printing block, one fine line at a time. A single motif can take three days to cut.', img:'Close-up: hands carving a wooden block', g:'linear-gradient(135deg,#6b4a2f,#c19a6b)'},
  {t:'Stamped with Nature', place:'Bakshi Ka Talab', tx:'Colour comes from pomegranate rind, indigo and madder root. Each block is pressed by hand, so no two repeats are identical.', img:'Close-up: natural dye block print on cotton', g:'linear-gradient(135deg,#3a4a6b,#a3b4c9)'},
  {t:'Sun & Slow Drying', place:'Gomti riverbank', tx:'Printed cloth rests in open air for two days, letting plant dyes bind to the fibre and deepen with the light.', img:'Close-up: fabric drying in sunlight', g:'linear-gradient(135deg,#b89a4a,#efe0b0)'},
  {t:'The Chikankari Hand', place:'Old Lucknow workshops', tx:'Local craftswomen work shadow stitches, murri and jaali with fine white thread. A single kurti holds up to 120 hours of embroidery.', img:'Close-up: hand embroidery stitch detail', g:'linear-gradient(135deg,#8c2f39,#e3b6b0)'},
  {t:'Finished, Folded, Sent', place:'To your door in Europe', tx:'Pressed, quality-checked and wrapped in recycled cotton, each piece travels with the name of the artisan who made it.', img:'Close-up: finished kurti with artisan tag', g:'linear-gradient(135deg,#3f5a4a,#b9cdb5)'},
];

function Lookbook() {
  const [i, setI] = useState(0);
  const [paused, setPaused] = useState(false);
  const go = d => setI(p => (p + d + STORY.length) % STORY.length);
  useEffect(() => { if (paused) return; const t = setInterval(() => go(1), 7000); return () => clearInterval(t); }, [paused]);
  useEffect(() => {
    const k = e => { if (e.key==='ArrowRight') go(1); if (e.key==='ArrowLeft') go(-1); };
    window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k);
  }, []);
  return html`<section id="craft" class="py-16 md:py-24 border-t" style=${{borderColor:'var(--line)'}}
    onMouseEnter=${()=>setPaused(true)} onMouseLeave=${()=>setPaused(false)}>
    <p class="text-xs tracking-[.3em] uppercase" style=${{color:'var(--gold)'}}>III · Craft</p>
    <h2 class="serif text-4xl md:text-5xl mt-2 mb-10">The Slow Fashion Lookbook</h2>
    <div class="card overflow-hidden">
      <div class="overflow-hidden"><div class="track flex" style=${{transform:`translateX(-${i*100}%)`}}>
        ${STORY.map((s,n) => html`<article key=${n} class="w-full shrink-0 grid md:grid-cols-2" aria-hidden=${n!==i}>
          <div class="relative min-h-[280px] md:min-h-[460px]" style=${{background:s.g}}>
            <div class="absolute inset-4 border border-white/40 flex items-end p-4">
              <span class="text-[10px] tracking-[.25em] uppercase text-white/90">HD image · ${s.img}</span></div></div>
          <div class="p-6 md:p-14 flex flex-col justify-center">
            <p class="serif italic text-lg" style=${{color:'var(--gold)'}}>Chapter${n+1} of ${STORY.length} ·${s.place}</p>
            <h3 class="serif text-4xl md:text-5xl my-4 leading-tight">${s.t}</h3>
            <p class="leading-relaxed max-w-md" style=${{color:'var(--mute)'}}>${s.tx}</p></div>
        </article>`)}
      </div></div>
      <div class="flex items-center justify-between px-6 md:px-10 py-5 border-t" style=${{borderColor:'var(--line)'}}>
        <div class="flex gap-2">${STORY.map((s,n)=>html`<button key=${n} onClick=${()=>setI(n)} aria-label=${'Go to '+s.t}
          class="h-1 transition-all duration-500" style=${{width:n===i?'36px':'14px',background:n===i?'var(--accent)':'var(--line)'}}></button>`)}</div>
        <div class="flex gap-3">
          <button onClick=${()=>go(-1)} class="w-10 h-10 border rounded-full" style=${{borderColor:'var(--line)'}} aria-label="Previous">←</button>

/* ---------- AI CHATBOT ---------- */
function chatCtx(){
 const s=store.s;
 return `You are the concierge assistant for The House of Nawabs, a luxury slow-fashion brand selling hand-crafted Lucknow Chikankari and block-printed kurtis to Europe. Tone: warm, refined, concise (under 90 words), plain text, no markdown. Use only the facts below. If unsure, say so and suggest the WhatsApp link in this chat window. Never invent policies, prices or stock.
SIZES: ${SIZES.map(z=>z.k+': UK '+z.uk+', EU '+z.eu+', US '+z.us+', garment chest/waist/hip '+z.g.join('/')+' cm').join('; ')}. Body limits for the recommendation: S under 92/74/98 cm (chest/waist/hip), M under 98/80/104, L under 104/86/110, XL above. The recommended size is the largest size any one measurement needs. The Fit Matrix on this page does it live.
PRODUCTS (base price EUR): ${SHOP.map(p=>p.n+' '+p.p+' ('+p.fab+')').join('; ')}. Made to measure adds 40 EUR and is final sale.
PRICING (DDP): duty applies to goods plus shipping, VAT to goods plus shipping plus duty. ${Object.entries(COUNTRIES).map(([k,v])=>k+' VAT '+v.vat+'% duty '+v.duty+'%').join('; ')}. Delivery: Express 38 EUR (3-5 working days), Economy 16 EUR (8-12 working days). Nothing to pay at the door. Rates are illustrative and confirmed at checkout. GBP and CHF are shown at demo rates.
RETURNS: 14-day legal withdrawal right, extended to 30 days. Items unworn, unwashed, tags attached, original packaging. First size exchange is free. Damaged or incorrect items: we cover return shipping and refund everything including delivery and duties. Change of mind: prepaid customs-cleared label, flat 12 EUR fee deducted. Refund within 5-7 business days of inspection. Duty and VAT refunded in full. Made-to-measure is final sale unless faulty.
CARE: hand wash cold, dry in shade, press inside-out on low heat.
THIS CUSTOMER NOW: ${s.user?'signed in as '+s.user.name.split(' ')[0]+', saved size '+s.user.size:'guest'}, destination ${s.country}, delivery ${s.ship}, recommended size ${s.size}, currency ${s.cur}, bag: ${s.cart.length?s.cart.map(i=>i.n+' size '+i.size).join(', '):'empty'}. A 185 EUR piece would cost them ${landed(185).t.toFixed(2)} EUR landed with their chosen delivery.`;
}
function Chatbot({ck}){
 const [open,setOpen]=useState(false),[msgs,setMsgs]=useState([]),[inp,setInp]=useState(''),[busy,setBusy]=useState(false);
 const box=React.useRef(null);
 useEffect(()=>{if(box.current)box.current.scrollTop=box.current.scrollHeight},[msgs,open]);
 const send=async t=>{
  t=(t||inp).trim(); if(!t||busy) return; setInp('');
  const hist=[...msgs,{role:'user',content:t}];
  const put=x=>setMsgs([...hist,{role:'assistant',content:x}]);
  put(''); setBusy(true);
  const input=hist.map((m,i)=>i===0?{role:'user',content:chatCtx()+'\n\nCustomer message: '+m.content}:m);
  try{
   const sample=window.claude&&await window.claude.use('sample');
   if(!sample) throw {code:'none'};
   const r=await sample(input,{cache:false,modelTier:'quick',onText:({text})=>put(text)});
   put(r.text);
  }catch(e){ put(e&&e.code==='rate_limited'?'Many requests at once. Please try again in a moment.':e&&(e.code==='none'||e.code==='not_granted')?'The assistant is unavailable right now. Our team is happy to help on WhatsApp during CET hours.':'Sorry, something went wrong. Please try again.'); }
  setBusy(false);
 };
 const chips=['What size should I order?','What will I pay in France?','How do size exchanges work?'];
 return html`<div>
  ${!open&&html`<button onClick=${()=>setOpen(true)} class='fixed right-4 z-20 px-5 py-3 text-xs tracking-widest uppercase rounded-full shadow-lg' style=${{bottom:ck?'calc(8rem + env(safe-area-inset-bottom,0px))':'calc(1rem + env(safe-area-inset-bottom,0px))',background:'var(--accent)',color:'#fff'}}>\u2726 Ask Nawabs</button>`}
  ${open&&html`<div class='fixed left-3 right-3 sm:left-auto sm:right-4 sm:w-96 card flex flex-col shadow-2xl' style=${{zIndex:25,bottom:'calc(0.75rem + env(safe-area-inset-bottom,0px))',height:'min(78vh,560px)',background:'var(--card)'}}>
   <div class='flex items-center justify-between px-4 py-3 border-b' style=${{borderColor:'var(--line)'}}>
    <div><p class='serif text-xl leading-none'>Nawabs Concierge</p><p class='text-[10px] tracking-widest uppercase mt-1' style=${{color:'var(--gold)'}}>AI assistant</p></div>
    <div class='flex items-center gap-4 text-xs'><a href='https://wa.me/' target='_blank' rel='noopener' class='underline' style=${mute}>Human (WhatsApp)</a><button onClick=${()=>setOpen(false)} aria-label='Close chat'>\u2715</button></div></div>
   <div ref=${box} class='flex-1 overflow-y-auto p-4 space-y-3 text-sm'>
    <div class='max-w-[85%] border p-3' style=${{borderColor:'var(--line)'}}>Welcome to The House of Nawabs. Ask me about sizing, what you will pay delivered to your country, returns or fabric care.</div>
    ${msgs.length===0&&html`<div class='flex flex-wrap gap-2'>${chips.map(c=>html`<button key=${c} onClick=${()=>send(c)} class='text-xs border px-3 py-2 text-left' style=${chip(false)}>${c}</button>`)}</div>`}
    ${msgs.map((m,i)=>html`<div key=${i} class=${'flex '+(m.role==='user'?'justify-end':'')}><div class='max-w-[85%] p-3 whitespace-pre-wrap' style=${m.role==='user'?{background:'var(--accent)',color:'#fff'}:{border:'1px solid var(--line)'}}>${m.content||'\u2026'}</div></div>`)}
   </div>
   <div class='border-t p-3' style=${{borderColor:'var(--line)'}}>
    <div class='flex gap-2'><input value=${inp} onInput=${e=>setInp(e.target.value)} onChange=${e=>setInp(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&send()} placeholder='Ask a question' aria-label='Message' class='flex-1 px-3 py-2 border bg-transparent text-sm outline-none' style=${{borderColor:'var(--line)',color:'var(--ink)'}}/>
    <button onClick=${()=>send()} disabled=${busy} class='px-4 text-xs tracking-widest uppercase' style=${{background:'var(--ink)',color:'var(--bg)',opacity:busy?.5:1}}>Send</button></div>
    <p class='text-[10px] mt-2' style=${mute}>AI can make mistakes. Final prices are confirmed at checkout.</p></div>
  </div>`}</div>`;
}
function Overlays(){
 const st=useStore(); const [ck,setCk]=useState(true),[done,setDone]=useState(false);
 const goods=st.cart.reduce((a,i)=>a+i.price,0), L=landed(goods);
 const rows=[['Garments',goods],[SHIP[st.ship].n+' delivery',L.sh],['Import duty ('+L.c.duty+'%)',L.d],['VAT · '+st.country+' ('+L.c.vat+'%)',L.v]];
 return html`<div>
 ${st.bag&&html`<div class="fixed inset-0 z-30 flex justify-end"><div class="absolute inset-0 bg-black/40" onClick=${()=>setStore({bag:false})}></div>
  <aside class="relative w-full max-w-md h-full overflow-y-auto p-6" style=${{background:'var(--bg)',paddingTop:'calc(1.5rem + env(safe-area-inset-top,0px))',paddingBottom:'calc(1.5rem + env(safe-area-inset-bottom,0px))'}}>
   <div class="flex justify-between items-center mb-6"><h3 class="serif text-3xl">Your bag</h3><button onClick=${()=>setStore({bag:false})} aria-label="Close">✕</button></div>
   ${st.cart.length===0?html`<p class="text-sm" style=${mute}>Your bag is empty.</p>`:html`<div>
    ${st.cart.map(i=>html`<div key=${i.k} class="flex justify-between py-3 border-b text-sm" style=${{borderColor:'var(--line)'}}><div><p class="serif text-lg">${i.n}</p><p class="text-xs" style=${mute}>Size ${i.size}${i.m?' · made to measure':''}</p><button class="text-xs underline" onClick=${()=>setStore({cart:st.cart.filter(x=>x.k!==i.k)})}>Remove</button></div><span>${eur(i.price)}</span></div>`)}
    <table class="w-full text-sm mt-4"><tbody>${rows.map(([l,v])=>html`<tr key=${l}><td class="py-1.5" style=${mute}>${l}</td><td class="text-right">${eur(v)}</td></tr>`)}</tbody>
     <tfoot><tr class="border-t-2" style=${{borderColor:'var(--ink)'}}><td class="pt-3 serif text-xl">Total, all paid</td><td class="pt-3 serif text-2xl text-right" style=${{color:'var(--accent)'}}>${eur(L.t)}</td></tr></tfoot></table>
    <p class="text-xs mt-4" style=${mute}>Hassle-free returns through our European returns hub. No fees at your door.</p>
    ${st.user?html`<p class="text-xs mt-3">Delivering to ${st.user.name}${st.user.city?', '+st.user.city:''}, ${st.user.country}</p>`:html`<button onClick=${()=>setStore({acct:true})} class="text-xs underline mt-3">Sign in for faster checkout</button>`}
    <div class="flex flex-wrap gap-2 my-5">${['Card','Apple Pay','Google Pay','Klarna','iDEAL','Bancontact'].map(x=>html`<span key=${x} class="text-[11px] border px-2 py-1" style=${{borderColor:'var(--line)'}}>${x}</span>`)}</div>
    <button onClick=${()=>setDone(true)} class="w-full py-3 text-xs tracking-[.25em] uppercase" style=${{background:'var(--accent)',color:'#fff'}}>Checkout</button>
    ${done&&html`<p class="text-xs mt-3" style=${{color:'var(--gold)'}}>Demo only. Connect Stripe or Adyen to take real payments.</p>`}</div>`}
  </aside></div>`}
 ${st.legal&&html`<div class="fixed inset-0 z-40 flex items-center justify-center p-5"><div class="absolute inset-0 bg-black/50" onClick=${()=>setStore({legal:null})}></div>
  <div class="card relative max-w-lg w-full p-8" style=${{background:'var(--card)'}}><h3 class="serif text-3xl mb-3">${st.legal}</h3><p class="text-sm leading-relaxed" style=${mute}>${LEGAL[st.legal]}</p>
  <p class="text-xs mt-4" style=${mute}>Placeholder text. Have these pages written or reviewed by a qualified lawyer before launch.</p>
  <button onClick=${()=>setStore({legal:null})} class="mt-5 text-xs tracking-widest uppercase underline">Close</button></div></div>`}
 ${ck&&html`<div class="fixed left-3 right-3 sm:right-auto z-20 sm:max-w-xs card p-4 text-xs" style=${{bottom:'calc(1rem + env(safe-area-inset-bottom,0px))'}}>We use essential cookies, plus optional ones with your consent.<div class="flex gap-3 mt-3"><button onClick=${()=>setCk(false)} class="underline">Accept</button><button onClick=${()=>setCk(false)} class="underline">Essential only</button></div></div>`}
 <${Account}/><${Chatbot} ck=${ck}/>
 </div>`;
}

      <div class="max-w-6xl mx-auto px-5 py-3 md:py-4 flex flex-wrap items-center justify-between gap-y-2">

      </div>
